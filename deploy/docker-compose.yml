services:
  postgres:
    image: postgres:16
    container_name: cmahjong-postgres
    environment:
      POSTGRES_USER: cmahjong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmahjong}
      POSTGRES_DB: cmahjong
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: cmahjong-api
    environment:
      DATABASE_URL: postgresql+psycopg://cmahjong:${POSTGRES_PASSWORD:-cmahjong}@postgres:5432/cmahjong
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-true}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:23333}
    depends_on:
      - postgres
    restart: unless-stopped

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: cmahjong-nginx
    ports:
      - "${HTTP_PORT:-23333}:23333"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
